# ==========================================================
# 【何をする】Googleビジネスプロフィールに翌日の空き枠を自動投稿
#            ＋同じ空き枠を公式LINE「予約空き情報」（@902nutdg）へ「明日の空き情報」として配信
#            （2026-09-09 院長指示「翌日の空き情報を15時に配信したい」。LINEが先・GBPが後）
#            ＋同じ空き枠で「予約の空き状況」ページ（shin3578-oss/oval-aki の data.json）を書き換える
#            （2026-10-10 院長指示。メインの公式LINEのリッチメニューから開く＝通知が鳴らずブロックされない）
#            ＋その先の診療日3日分もページへ書き足す（aki_page_ahead.py・2026-10-11 院長「3日間出して」）
# 【いつ動く】日〜金 15:00｜Cron-job.org「GBP空き枠自動投稿」ジョブが起動（2026-09-09に14:30→15:00へ）
#            （翌日分を投稿するため、翌日が休診日=日曜になる土曜は動かない）
# 【同梱】gbp_mtg_notice.py（全体MTGの3日前お知らせ）／短期集中治療 希望アラート／公式LINE 来月の題（毎月20日・line_oa_topic.py）
#        ／空き枠をXへも（Buffer経由）／ブログ新着をX・Facebookへ紹介（blog_sns_post.py）
# 【検証のしかた】preview=true だけだとLINEは本当に配信されるので、必ず aki_dry_run=true も一緒に付ける
#
# ★このリポジトリは公開。**スクリプト本体は置いていない**。
#   実行のたびに非公開リポジトリ apotool-automation を app/ に取り出して動かす。
#   公開になるのは「どれをいつ動かすか」という段取りと、**マスク済みの実行ログ**だけ。
#   ★ログの出し方は runner/emit.sh に一本化してある。
#     成功した回は**中身を公開しない**（1行だけ）。失敗した回だけ mask.py を通して出す。
#     マスクだけに頼ると、名簿に無い新しいスタッフの名前が漏れるため二重にしている。
# ==========================================================
name: GBP空き枠投稿（翌日分）

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日（YYYY-MM-DD形式。空欄=翌日）'
        required: false
      preview:
        description: 'プレビューのみ（投稿しない）: true/false'
        required: false
        default: 'false'
      no_notify:
        description: '検証用・院長DMに通知を飛ばさない: true/false'
        required: false
        default: 'false'
      skip_tanki:
        description: '短期集中治療アラートを飛ばす（検証用）: true/false'
        required: false
        default: 'false'
      aki_dry_run:
        description: '公式LINE「予約空き情報」への翌日分配信を検証モードに（文面生成とトークン確認のみ・配信しない）: true/false'
        required: false
        default: 'false'

jobs:
  gbp-post:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # クッキーが切れて取り直したとき、書き戻す先を**このリポジトリ**にする。
      # 読んでいるSecretsと書き戻し先がズレると毎回クッキー切れになるため。
      SECRETS_REPO: shin3578-oss/kds-runner

    steps:
      # 1本目＝このリポジトリ（mask.py を使う）。2本目＝中身の入った非公開リポジトリ。
      - uses: actions/checkout@v4
        with:
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: shin3578-oss/apotool-automation
          token: ${{ secrets.APOTOOL_PAT }}
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt

      # Playwrightのブラウザ本体（約170MB）を使い回してActionsの時間を節約する
      - name: Playwrightブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-v1

      - name: Playwrightブラウザをインストール
        run: |
          playwright install chromium
          sudo apt-get install -y xvfb

      - name: GBP空き枠投稿
        env:
          APOTOOL_EMAIL:           ${{ secrets.APOTOOL_EMAIL }}
          APOTOOL_PASSWORD:        ${{ secrets.APOTOOL_PASSWORD }}
          GOOGLE_GBP_COOKIES:      ${{ secrets.GOOGLE_GBP_COOKIES }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_GBP_PASSWORD:     ${{ secrets.GOOGLE_GBP_PASSWORD }}
          GOOGLE_GBP_EMAIL:        ${{ secrets.GOOGLE_GBP_EMAIL }}
          GOOGLE_CLIENT_ID:        ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:    ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN:       ${{ secrets.GBP_REFRESH_TOKEN }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET:        ${{ secrets.LW_CLIENT_SECRET }}
          GITHUB_PAT:              ${{ secrets.YT_TRIGGER_PAT }}
          MASK_NAMES:              ${{ secrets.MASK_NAMES }}
          # 公式LINE「予約空き情報」（@902nutdg）へ翌日の空きを同じ実行で配信（2026-09-09）
          LINE_OA_TOKEN_AKI:       ${{ secrets.LINE_OA_TOKEN_AKI }}
          # 空き枠ページ（https://shin3578-oss.github.io/oval-aki/）の data.json を書き換える（2026-10-10）
          AKI_PAGE_PAT:            ${{ secrets.AKI_PAGE_PAT }}
          # 同じ空きを X へ（Buffer経由・無料。2026-10-13 院長指示）。未登録なら投稿しないだけ
          BUFFER_API_KEY:          ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_TWITTER: ${{ secrets.BUFFER_CHANNEL_TWITTER }}
          BUFFER_CHANNEL_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_FACEBOOK }}
        run: |
          set +e
          run_once () {
            xvfb-run python -u gbp_slot_post.py               ${{ inputs.target_date }}               ${{ inputs.preview == 'true' && '--preview' || '' }}               ${{ inputs.no_notify == 'true' && '--no-notify' || '' }}               --with-aki-tomorrow ${{ inputs.aki_dry_run == 'true' && '--aki-dry-run' || '' }}               > "$1" 2>&1
          }
          run_once /tmp/step.log
          code=$?
          # ── 二段目の保険（2026-09-08追加）──────────────────────────────
          # 一時的な通信エラーでアポツール側の処理中に落ちることがある
          # （例: net::ERR_ABORTED）。**投稿する手前で落ちた回だけ**、90秒待って
          # 1回だけやり直す。「プレビュー」が出ていない＝GBPにも公式LINE（予約空き情報の
          # 翌日分も含む。配信の直前に「配信文プレビュー」を出す）にも何も出していない、
          # と確実に言えるので、二重投稿・二重配信にはならない。
          if [ $code -ne 0 ] && ! grep -q "プレビュー" /tmp/step.log; then
            echo "▲ 投稿する前に落ちたため、90秒待って1回だけやり直します" >> /tmp/step.log
            sleep 90
            run_once /tmp/retry.log
            code=$?
            cat /tmp/retry.log >> /tmp/step.log
          fi
          bash ../runner/emit.sh $code /tmp/step.log

      - name: 失敗した画面の証跡をアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-failure-gbp-slot-post
          path: app/login_failure/
          if-no-files-found: ignore
          retention-days: 14

      # 空き枠ページは「診療日3日分」を出す（2026-10-11 院長「3日間出して」）。
      # 上の本番の回は翌日分だけなので、その先の診療日3日分をここで書き足す（配信・投稿・院長DMはしない）。
      # 失敗しても後のステップは止めず、専用の一文で失敗通知Botへ。
      - name: 空き枠ページ（2日後以降の診療日3日分）
        id: aki_ahead
        if: ${{ always() && inputs.preview != 'true' }}
        continue-on-error: true
        env:
          APOTOOL_EMAIL:    ${{ secrets.APOTOOL_EMAIL }}
          APOTOOL_PASSWORD: ${{ secrets.APOTOOL_PASSWORD }}
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          AKI_PAGE_PAT:     ${{ secrets.AKI_PAGE_PAT }}
          MASK_NAMES:       ${{ secrets.MASK_NAMES }}
          # 休診チェックの「GBP特別営業時間」を本番の回と同じく使うため
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN:    ${{ secrets.GBP_REFRESH_TOKEN }}
        run: |
          set +e
          python -u aki_page_ahead.py ${{ inputs.target_date }} ${{ inputs.aki_dry_run == 'true' && '--aki-dry-run' || '' }} > /tmp/step.log 2>&1
          bash ../runner/emit.sh $? /tmp/step.log

      - name: 空き枠ページの失敗をLINEワークスに通知
        if: steps.aki_ahead.outcome == 'failure'
        env:
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          NOTIFY_MESSAGE:   "❌ 空き枠ページ（2日後以降）の書き込み失敗 — GitHub Actions でログを確認してください"
          NOTIFY_BOT_ID: "12789558"  # 失敗通知Bot
        run: python lw_notify.py

      - name: 全体MTGお知らせ（3日前・GBP＋公式LINE）
        if: ${{ inputs.preview != 'true' }}
        env:
          APOTOOL_EMAIL:        ${{ secrets.APOTOOL_EMAIL }}
          APOTOOL_PASSWORD:     ${{ secrets.APOTOOL_PASSWORD }}
          GOOGLE_GBP_COOKIES:   ${{ secrets.GOOGLE_GBP_COOKIES }}
          GOOGLE_GBP_PASSWORD:  ${{ secrets.GOOGLE_GBP_PASSWORD }}
          GOOGLE_GBP_EMAIL:     ${{ secrets.GOOGLE_GBP_EMAIL }}
          GBP_REFRESH_TOKEN:    ${{ secrets.GBP_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LW_PRIVATE_KEY:       ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET:     ${{ secrets.LW_CLIENT_SECRET }}
          GITHUB_PAT:           ${{ secrets.YT_TRIGGER_PAT }}
          LINE_OA_TOKEN:        ${{ secrets.LINE_OA_TOKEN }}
          DRIVE_TOKEN_JSON:     ${{ secrets.DRIVE_TOKEN_JSON }}
          MASK_NAMES:           ${{ secrets.MASK_NAMES }}
        run: |
          set +e
          xvfb-run python -u gbp_mtg_notice.py > /tmp/step.log 2>&1
          bash ../runner/emit.sh $? /tmp/step.log

      # 公式LINE（メイン）月1回の来院案内：来月の題を院長DMへ（2026-10-13 院長指示）。
      # 毎月20日以降の最初の実行で1回だけ送る（送った月は app/line_oa_topic_notified.txt に残し、下のマーカーコミットで保存）。
      # 文面づくりはClaude Codeのセッションで行う（AIのAPIは使わない）。数秒なのでジョブは分けない。
      - name: 公式LINE 来月の題を知らせる（毎月20日）
        id: line_topic
        if: ${{ always() && inputs.preview != 'true' }}
        continue-on-error: true
        env:
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          LINE_OA_TOKEN:    ${{ secrets.LINE_OA_TOKEN }}
          NO_NOTIFY:        ${{ inputs.no_notify }}
          MASK_NAMES:       ${{ secrets.MASK_NAMES }}
        run: |
          set +e
          python -u line_oa_topic.py > /tmp/step.log 2>&1
          bash ../runner/emit.sh $? /tmp/step.log

      - name: 公式LINE 来月の題の失敗をLINEワークスに通知
        if: steps.line_topic.outcome == 'failure'
        env:
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          NOTIFY_MESSAGE:   "❌ 公式LINE 来月の題 失敗 — GitHub Actions でログを確認してください"
          NOTIFY_BOT_ID: "12789558"  # 失敗通知Bot
        run: python lw_notify.py

      # 医院HPのブログ新着（歯の豆知識・症例集など）を X・Facebook へ紹介（Buffer経由・無料。2026-10-13 院長指示）。
      # 紹介済みの印は app/blog_sns_posted.json（下のマーカーコミットで保存）。数秒なのでジョブは分けない。
      - name: ブログ新着をSNSへ紹介（X・Facebook）
        id: blog_sns
        if: ${{ always() && inputs.preview != 'true' }}
        continue-on-error: true
        env:
          BUFFER_API_KEY:   ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_TWITTER: ${{ secrets.BUFFER_CHANNEL_TWITTER }}
          BUFFER_CHANNEL_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_FACEBOOK }}
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          NO_NOTIFY:        ${{ inputs.no_notify }}
          MASK_NAMES:       ${{ secrets.MASK_NAMES }}
        run: |
          set +e
          python -u blog_sns_post.py > /tmp/step.log 2>&1
          bash ../runner/emit.sh $? /tmp/step.log

      - name: ブログ新着SNS紹介の失敗をLINEワークスに通知
        if: steps.blog_sns.outcome == 'failure'
        env:
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          NOTIFY_MESSAGE:   "❌ ブログ新着のSNS紹介 失敗 — GitHub Actions でログを確認してください"
          NOTIFY_BOT_ID: "12789558"  # 失敗通知Bot
        run: python lw_notify.py

      # 短期集中治療 希望アラート（1日3回のうち14:30の回）。
      # 通知済みの印は訴求リストの⑤タブなので状態ファイルは持たない。
      # 送り先は院長DM＋斉藤さんDMの2人だけ（チャンネルには出さない）。
      - name: 短期集中治療 希望アラート（問診票の新規回答）
        id: tanki_alert
        if: ${{ always() && inputs.skip_tanki != 'true' }}
        continue-on-error: true
        env:
          APOTOOL_EMAIL:        ${{ secrets.APOTOOL_EMAIL }}
          APOTOOL_PASSWORD:     ${{ secrets.APOTOOL_PASSWORD }}
          DRIVE_TOKEN_PATH:     /tmp/drive_token_tanki.json
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LW_PRIVATE_KEY:       ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET:     ${{ secrets.LW_CLIENT_SECRET }}
          MASK_NAMES:           ${{ secrets.MASK_NAMES }}
        run: |
          set +e
          echo '${{ secrets.DRIVE_TOKEN_JSON }}' > /tmp/drive_token_tanki.json
          python -u monshin_tanki_alert.py > /tmp/step.log 2>&1
          bash ../runner/emit.sh $? /tmp/step.log

      - name: 短期集中治療アラートの失敗をLINEワークスに通知
        if: steps.tanki_alert.outcome == 'failure'
        env:
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          NOTIFY_MESSAGE:   "❌ 短期集中治療 希望アラート 失敗 — GitHub Actions でログを確認してください"
          NOTIFY_BOT_ID: "12789558"  # 失敗通知Bot
        run: python lw_notify.py

      # 投稿済みマーカーは apotool-automation 側に持ち帰る（checkout時のPATで push できる）
      - name: 投稿済みマーカー等をコミット
        if: ${{ always() && inputs.preview != 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # ★2026-09-14 事故: 無くなったファイル名（gbp_pending_post.txt）が混ざっていたため git add が
          #   3ファイルまとめて失敗し、「投稿済み」の印が毎回捨てられて公式LINEへ2日連続で同じお知らせが出た。
          #   → あるファイルだけ1つずつ add する。push に失敗したら赤で終える（印が残らない＝翌日また配信されるため）。
          for f in gbp_mtg_announced.txt line_mtg_announced.txt gbp_pending_post.txt line_oa_topic_notified.txt blog_sns_posted.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "マーカーに変更なし（コミットしない）"
            exit 0
          fi
          git commit -m "GBP state update $(date '+%Y-%m-%d')"
          git pull --rebase --autostash
          git push
          echo "マーカーを保存しました: $(git log -1 --format=%h)"

      - name: 実行結果をLINEワークスに通知
        if: failure()
        env:
          LW_PRIVATE_KEY: ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          NOTIFY_MESSAGE: "❌ GBP空き枠投稿 失敗（kds-runner） — GitHub Actions でログを確認してください"
          NOTIFY_BOT_ID: "12789558"  # 失敗通知Bot
        run: python lw_notify.py
