# ==========================================================
# 【何をする】空き枠の集め直し（翌日〜30日先）の「中継」。本体は apotool-automation の aki_refresh.yml（非公開）へ移した。
#            ここは受け取った入力をそのまま渡して本体を起動するだけ（数秒）
# 【いつ動く】月〜土 12:30ごろ｜同意書控えGASの時刻起動 ykMiddayRefresh がここを dispatch する
#            （GASの宛先を書き換えずに済むよう、ここを中継として残している・2026-10-22〜）
#            朝8:30の回は apotool の spt_alert.yml が本体を直接起動する
# 【同梱】なし
# ==========================================================
name: 空き枠の朝の集め直し（翌日〜30日先）

on:
  workflow_dispatch:
    inputs:
      aki_dry_run:
        description: '検証用：data.json とGASへ書かない: true/false'
        required: false
        default: 'false'
      no_notify:
        description: '検証用：失敗の通知を飛ばさない: true/false'
        required: false
        default: 'false'
      stamp:
        description: '空き枠ページの「◯時点」に出す時刻（空欄＝本体の開始時刻）'
        required: false
        default: ''

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 本体（apotool-automation の aki_refresh.yml）を起動
        env:
          YT_TRIGGER_PAT: ${{ secrets.YT_TRIGGER_PAT }}
          IN_DRY:   ${{ inputs.aki_dry_run }}
          IN_NN:    ${{ inputs.no_notify }}
          IN_STAMP: ${{ inputs.stamp }}
        run: |
          BODY=$(python3 -c 'import json,os;print(json.dumps({"ref":"main","inputs":{"aki_dry_run":os.environ.get("IN_DRY") or "false","no_notify":os.environ.get("IN_NN") or "false","stamp":os.environ.get("IN_STAMP") or ""}}))')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $YT_TRIGGER_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/shin3578-oss/apotool-automation/actions/workflows/aki_refresh.yml/dispatches" \
            -d "$BODY")
          echo "本体の起動: HTTP $CODE"
          [ "$CODE" = "204" ]
